[project]
name = "subpixel-tracking-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "numpy>=2.1,<3.0",
  "opencv-python-headless>=4.10,<5.0",
  "openpyxl>=3.1,<4.0",
  "reportlab>=4.2,<5.0",
  "python-multipart>=0.0.20,<1.0"
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1.0", "pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
